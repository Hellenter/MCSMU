[package]
name = "mcsm-web"
version = "0.1.0"
edition = "2021"
description = "MC Server Manager Web — управление серверами Minecraft через браузер"

[[bin]]
name = "MCServerManagerWeb"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = "0.4"
md-5 = "0.10"
ureq = { version = "2", features = ["json"] }
dirs = "5"
regex = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
