[package]
name = "mcsm"
version = "2.0.0"
edition = "2021"
description = "MC Server Manager — управление серверами Minecraft"

[[bin]]
name = "MCServerManager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
egui_extras = { version = "0.31" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
chrono = "0.4"
md-5 = "0.10"
ureq = { version = "2", features = ["json"] }
dirs = "5"
regex = "1"
walkdir = "2"
open = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

