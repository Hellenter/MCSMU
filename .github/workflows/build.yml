name: Build Windows exe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller psutil
      - run: pyinstaller --noconfirm --onefile --windowed --name MCServerManager main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MCServerManager
          path: dist/MCServerManager.exe
