name: Build Windows exe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release
        working-directory: rust
      - uses: actions/upload-artifact@v4
        with:
          name: MCServerManager
          path: rust/target/release/MCServerManager.exe
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller psutil
      - run: pyinstaller --noconfirm --onefile --windowed --name MCServerManager-python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MCServerManager-python
          path: dist/MCServerManager-python.exe
